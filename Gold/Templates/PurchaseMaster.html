<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
   {% load static %}
   <!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!-- Bootstrap Icons -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <script type="text/javascript" src="{% static 'Js/Basic.js' %}"></script>
     <link rel="stylesheet" href="{% static 'Css/MsgBox.css' %}">
    <script type="text/javascript" src="{% static 'Js/MsgBox.js' %}"></script>
    <script type="text/javascript" src="{% static 'Js/Login.js' %}"></script>
<style>
    :root {
        --primary-gradient: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
        --card-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
        --input-border: #e2e8f0;
        --input-focus: #3b82f6;
        --text-dark: #1e293b;
        --text-secondary: #64748b;
    }

    body {
        font-family: 'Inter', sans-serif;
        background-color: #f5f7fa;
    }

    .form-container {
        max-width: 800px;
        margin: 0 auto;
        animation: fadeInUp 0.6s ease backwards;
    }

    .card-creation {
        background: white;
        border-radius: 20px;
        box-shadow: var(--card-shadow);
        border: none;
        overflow: hidden;
    }

    .card-header-gradient {
        background: var(--primary-gradient);
        padding: 2rem 2.5rem;
        color: white;
        position: relative;
        overflow: hidden;
    }

    .card-header-gradient::after {
        content: '';
        position: absolute;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        background: linear-gradient(45deg, rgba(255, 255, 255, 0.1), transparent);
    }

    .header-content {
        position: relative;
        z-index: 1;
    }

    .header-content h4 {
        font-weight: 700;
        margin: 0;
        font-size: 1.5rem;
        display: flex;
        align-items: center;
        gap: 0.75rem;
    }

    .card-body {
        padding: 2.5rem;
    }

    .form-label {
        color: var(--text-dark);
        font-weight: 600;
        font-size: 0.9rem;
        margin-bottom: 0.5rem;
    }

    .form-control,
    .form-select {
        border-color: var(--input-border);
        padding: 0.75rem 1rem;
        border-radius: 10px;
        font-size: 0.95rem;
        transition: all 0.2s;
        background-color: #f8fafc;
    }

    .form-control:focus,
    .form-select:focus {
        border-color: var(--input-focus);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        background-color: white;
    }

    .form-text {
        color: var(--text-secondary);
        font-size: 0.85rem;
        margin-top: 0.4rem;
    }

    .urgent-toggle {
        background: #fff1f2;
        border: 1px solid #fecaca;
        padding: 1rem 1.5rem;
        border-radius: 12px;
        display: flex;
        align-items: center;
        gap: 0.75rem;
    }

    .form-check-input {
        width: 1.3em;
        height: 1.3em;
        cursor: pointer;
    }

    .form-check-input:checked {
        background-color: #ef4444;
        border-color: #ef4444;
    }

    .btn-create-task {
        background: var(--primary-gradient);
        color: white;
        border: none;
        padding: 0.875rem 2rem;
        border-radius: 12px;
        font-weight: 600;
        font-size: 1rem;
        transition: all 0.3s;
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .btn-create-task:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(59, 130, 246, 0.4);
        color: white;
    }

    .btn-cancel {
        background: white;
        color: var(--text-secondary);
        border: 1px solid #e2e8f0;
        padding: 0.875rem 1.5rem;
        border-radius: 12px;
        font-weight: 500;
        transition: all 0.2s;
        text-decoration: none;
    }

    .btn-cancel:hover {
        background: #f8fafc;
        color: var(--text-dark);
    }

    @keyframes fadeInUp {
        from {
            opacity: 0;
            transform: translateY(20px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    .form-control {
    display: block;
    width: 100%;
    height: 34px;
    padding: 6px 12px;
    font-size: 16px;
    line-height: 1.42857143;
    color: #1e579df0 !important;
    background-color: #fff;
    background-image: none;
    border: 1px solid #1e579df0;
    border-radius: 4px;
    -webkit-box-shadow: inset 0 1px 1px rgba(0, 0, 0, .075);
    box-shadow: inset 0 1px 1px rgba(0, 0, 0, .075);
    -webkit-transition: border-color ease-in-out .15s, -webkit-box-shadow ease-in-out .15s;
    -o-transition: border-color ease-in-out .15s, box-shadow ease-in-out .15s;
    transition: border-color ease-in-out .15s, box-shadow ease-in-out .15s;
}

    .form-control:focus {
         border-radius: 10px 2px 10px !important;
         border-color: forestgreen !important;
         background-color: white !important;
         font-size:18px;
         color:blue !important;
        /*border-color: #94ba33;
        border-color: red;*/
        outline: 0;
        /*-webkit-box-shadow:  0 1px 1px rgba(148, 186, 51, 1), 0 0 8px rgba(148, 186, 51, 1);
        box-shadow:  0 1px 1px rgba(148, 186, 51, 1), 0 0 8px rgba(148, 186, 51, 1);*/
        /*-webkit-box-shadow: 2px 2px 5px 0px rgba(0,0,0,0.75);
        -moz-box-shadow: 2px 2px 5px 0px rgba(0,0,0,0.75);
        box-shadow: 2px 2px 5px 0px rgba(0,0,0,0.75);*/


        /*-webkit-box-shadow: 0px 0px 8px -3px rgba(0,0,0,0.75);
-moz-box-shadow: 0px 0px 8px -3px rgba(0,0,0,0.75);
box-shadow: 0px 0px 8px -3px rgba(0,0,0,0.75);*/


        /*-webkit-box-shadow: 0px 0px 6px 0px rgba(148,186,51,1);
-moz-box-shadow: 0px 0px 6px 0px rgba(148,186,51,1);
box-shadow: 0px 0px 6px 0px rgba(148,186,51,1);*/
    }

    .form-control::-moz-placeholder {
        color: #999;
        opacity: 1;
    }

    .form-control:-ms-input-placeholder {
        color: #999;
    }

    .form-control::-webkit-input-placeholder {
        color: #999;
    }

    .form-control::-ms-expand {
        background-color: transparent;
        border: 0;
    }

    .form-control[disabled], .form-control[readonly], fieldset[disabled] .form-control {
        background-color: #eee;
        opacity: 1;
    }

    .form-control[disabled], fieldset[disabled] .form-control {
        cursor: not-allowed;
    }
    label {
    display: inline-block;
    max-width: 100%;
    margin-bottom: 5px;
    font-weight: 700;
}
label {
    color: #1e579df0 !important;
}
.btnSave {
    background: var(--primary-gradient);
    color: white;
    border: none;
    padding: 0.875rem 2rem;
    border-radius: 12px;
    font-weight: 600;
    font-size: 1rem;
    transition: all 0.3s;
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
}
.btnCancel {
    background: #ebe2e2;
    color: var(--text-secondary);
    border: 1px solid #e2e8f0;
    padding: 0.875rem 1.5rem;
    border-radius: 12px;
    font-weight: 500;
    transition: all 0.2s;
    text-decoration: none;
}
</style>
</head>
<body>
<div class="form-container">
    <div class="card-creation">
        <div class="card-header-gradient">
            <div class="header-content">
                <h4><i class="bi bi-plus-circle"></i> Purchase Master</h4>
                <p class="mb-0 mt-2 text-white-50">This is a page to create Purchase Details</p>
            </div>
        </div>
        <div class="card-body">
               <div class="col-md-12">
                <div class="col-md-6"><label >Customer Name</label></div>
                <div class="col-md-6"><input class="form-control" type="text" id="id_CustomerName" placeholder="Customer_Name"></div>
               </div>

               <div class="col-md-12">
                <div class="col-md-6"><label  style="text-align:center">Mobile Number</label></div>
                <div class="col-md-6"><input class="form-control" type="text" id="id_MobileNumber" maxlength="10" placeholder="Mobile_Number"></div>
               </div>

            <div class="col-md-12">
                <div class="col-md-6"><label  style="text-align:center">Adhar Number</label></div>
                <div class="col-md-6"><input class="form-control" type="text" id="id_Adhar" maxlength="12" placeholder="Adhar_Number"></div>
               </div><div class="clearfix">
            <div class="col-md-12">
                <div class="col-md-6"><label  style="text-align:center">Purchased Gold</label></div>
                <div class="col-md-6"><input class="form-control" type="text" id="id_Gold" placeholder="Enter Gold Gram"></div>
               </div>
              <div class="col-md-12">
                <div class="col-md-6"><label  style="text-align:center">Payment Method</label></div>
                <div class="col-md-6"><select name="Payment_Category" class="form-control form-select" id="id_category">
  <option value="None">Select</option>
  <option value="Daily">Daily Payment</option>

  <option value="Monthly">Monthly Payment</option>

  <option value="Yearly">Yearly Payment</option>



</select></div>
               </div><div class="clearfix">
        </div><br><br>
              <div class="col-md-12">
            <div class="col-md-6"></div>
            <div class="col-md-6" style="text-align:right;"><button class="btnSave">Save</button> <button class="btnCancel">Cancel</button></div>
        </div>
        </div>

    </div>
</div>
</body>
</html>
